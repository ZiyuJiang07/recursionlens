[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "recursionlens"
version = "0.2.0"
description = "Interactive recursion tracing, subproblem DAGs, memoization comparisons, and a Python Tutor-style step-through tutor for JupyterLab."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Ziyu JIANG" },
  { name = "Xinyue CAI" },
  { name = "Kehan CAO" },
  { name = "Ruoxi LYU" },
  { name = "Haobo MA" },
]
keywords = ["recursion", "jupyterlab", "visualization", "memoization", "education", "debugging", "python-tutor"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Education",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Framework :: Jupyter",
]

[project.urls]
Homepage = "https://github.com/ZiyuJiang07/recursionlens"
Website = "https://ziyujiang07.github.io/recursionlens/"
Repository = "https://github.com/ZiyuJiang07/recursionlens"
Documentation = "https://github.com/ZiyuJiang07/recursionlens#readme"
Tutorial = "https://github.com/ZiyuJiang07/recursionlens/blob/main/docs/RecursionLens_Tutorial.ipynb"
Issues = "https://github.com/ZiyuJiang07/recursionlens/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "coverage>=7", "ipywidgets>=7.6"]
tutor = ["ipywidgets>=7.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
