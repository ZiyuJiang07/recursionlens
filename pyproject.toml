[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recursionlens"
version = "0.1.1"
description = "Interactive recursion tracing, subproblem DAGs, and memoization comparisons for JupyterLab."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Ziyu Jiang" }]
keywords = ["recursion", "jupyterlab", "visualization", "memoization", "education"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Education",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Framework :: Jupyter",
]

[project.urls]
Homepage = "https://github.com/ZiyuJiang07/recursionlens"
Repository = "https://github.com/ZiyuJiang07/recursionlens"
Documentation = "https://github.com/ZiyuJiang07/recursionlens#readme"
Issues = "https://github.com/ZiyuJiang07/recursionlens/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "coverage>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
