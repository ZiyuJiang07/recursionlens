[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "recursionlens"
version = "0.1.2"
description = "Interactive recursion tracing, subproblem DAGs, and memoization comparisons for JupyterLab."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Ziyu Jiang" },
  { name = "Xinyue Cai" },
  { name = "Kehan Cao" },
  { name = "Ruoxi Lyu" },
  { name = "Haobo Ma" },
]
keywords = ["recursion", "jupyterlab", "visualization", "memoization", "education"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Education",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Framework :: Jupyter",
]

[project.urls]
Homepage = "https://github.com/ZiyuJiang07/recursionlens"
Repository = "https://github.com/ZiyuJiang07/recursionlens"
Documentation = "https://github.com/ZiyuJiang07/recursionlens/blob/main/docs/USER.md"
Tutorial = "https://github.com/ZiyuJiang07/recursionlens/blob/main/docs/RecursionLens_Tutorial.ipynb"
Changelog = "https://github.com/ZiyuJiang07/recursionlens/blob/main/CHANGELOG.md"
Issues = "https://github.com/ZiyuJiang07/recursionlens/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "coverage>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
