name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Stage site
        run: |
          mkdir -p _site
          cp -r index.html assets src _site/
          printf '{"commit":"%s","built":"%s"}' "$GITHUB_SHA" "$(date -u +%FT%TZ)" > _site/version.json
          sed -i "s|assets/app.css|assets/app.css?v=${GITHUB_SHA}|; s|assets/app.js|assets/app.js?v=${GITHUB_SHA}|" _site/index.html
          grep -o 'assets/app.js?v=[a-f0-9]\{7\}' _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Smoke test
        run: |
          sleep 5
          curl -fsS "${{ steps.deployment.outputs.page_url }}" | grep -q "RecursionLens"
          curl -fsS "${{ steps.deployment.outputs.page_url }}src/recursionlens/_tutor.py" | grep -q "record_tutor"
